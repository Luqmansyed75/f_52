services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meetings
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  nats:
    image: nats:latest
    container_name: nats
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"

  meet-container:
    build:
      context: ./meet-container
      dockerfile: Dockerfile
    image: meet-service:latest
    container_name: meet-container
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "5001:5001"
    environment:
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME:-AI Assistant}
      - MEET_SERVICE_PORT=5001
    volumes:
      - chrome_profile:/chrome-profile

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: meet-backend:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - nats
      - redis
      - meet-container
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEYS=${GROQ_API_KEYS}
      - ASR_BACKEND=${ASR_BACKEND:-groq}
      - TTS_ENGINE=${TTS_ENGINE:-kokoro}
      - ALLOW_HF_DOWNLOAD=1
      - MEET_SERVICE_URL=http://meet-container:5001
      - MEET_SERVICE_WS=ws://meet-container:5001/audio
      - MEET_URL=${MEET_URL}
      - BOT_DISPLAY_NAME=${BOT_DISPLAY_NAME:-AI Assistant}
      - POSTGRES_DSN=postgresql://voiceagent:password@postgres:5432/meetings
      - QDRANT_URL=http://qdrant:6333
      - NATS_URL=nats://nats:4222
      - TTS_ENGINE=piper
      - KOKORO_VOICE=${KOKORO_VOICE:-am_adam}

    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./audio:/app/audio
      - ./asr:/app/asr
      - ./backend:/app/backend
      - ./tts:/app/tts
      - ./streaming:/app/streaming
      - ./meeting:/app/meeting
      - ./memory:/app/memory
      - ./llm:/app/llm
      - ./core:/app/core
      - ./config.py:/app/config.py
  login-helper:
    build:
      context: ./meet-container
      dockerfile: Dockerfile
    image: meet-service:latest
    container_name: login-helper
    profiles:
      - login
    shm_size: "2gb"
    ports:
      - "6080:6080"
    volumes:
      - chrome_profile:/chrome-profile
    entrypoint:
      - /bin/bash
      - -c
      - |
        rm -f /chrome-profile/Singleton* /tmp/.X99-lock /tmp/.X11-unix/X99
        Xvfb :99 -screen 0 1280x800x24 -ac &
        export DISPLAY=:99
        sleep 1
        fluxbox &
        sleep 1
        x11vnc -display :99 -nopw -listen 127.0.0.1 -xkb -forever -shared -bg
        websockify --web /usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900 &
        sleep 1
        echo "=========================================================="
        echo "  LOGIN DESKTOP IS LIVE!"
        echo "  Open on Windows: http://localhost:6080/vnc.html"
        echo "=========================================================="
        exec google-chrome-stable \
          --no-sandbox \
          --disable-dev-shm-usage \
          --disable-gpu \
          --user-data-dir=/chrome-profile \
          --no-first-run \
          --disable-default-apps \
          "https://accounts.google.com/signin"

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
  chrome_profile: